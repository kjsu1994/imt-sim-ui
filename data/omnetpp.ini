# Dijkstra baseline: 132-satellite Walker-Delta (12 planes x 11), +Grid ISLs,
# NASA DSN + ESA ESTRACK ground stations, ships and aircraft on regular routes.
# downlink: station -> (GSL) -> satellites -> ISLs -> (GSL) -> ship/aircraft
# (uplink ship/aircraft -> station is implemented but switched off in the configs for now)

[General]
network = Florasat.Dijkstra132.LeoDijkstra
rng-class = "cMersenneTwister"
seed-0-mt = 23542
simtime-resolution = -11
sim-time-limit = 600s
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec

# ---------------- constellation (Walker-Delta 132/12/1, 550 km, 53 deg) ----------------
*.numSatellites = 132
*.constellationCreator.enabled = true
*.constellationCreator.raanSpread = 360
*.constellationCreator.inclination = 53
*.constellationCreator.altitude = 550
*.constellationCreator.baseYear = 20
*.constellationCreator.baseDay = 1.5
*.constellationCreator.epochYear = 20
*.constellationCreator.epochDay = 1.5
*.**.planeCount = 12                 # also used by topologyControl
*.**.interPlaneSpacing = 1           # Walker phasing F
**.allowUnevenPlanes = false
**.intraPlaneIslDisabled = false
**.interPlaneIslDisabled = false
*.satellite[*].NoradModule.satIndex = 0
*.satellite[*].NoradModule.satName = ""
**.satellite[*].**.initFromDisplayString = false
*.satellite[*].mobility.faceForward = false
*.satellite[*].noradModuleType = "Sat_Mob_NoradA"

*.topologyControl.walkerType = "DELTA"
*.topologyControl.updateInterval = 1s
*.topologyControl.timeSliceLength = 5000ms
*.topologyControl.minimumElevation = 10     # ground station <-> satellite (132 sats: 25 deg leaves large gaps)
*.topologyControl.islDatarate = 100000000      # 100 Mbit/s
*.topologyControl.groundlinkDatarate = 50000000
*.topologyControl.channelLineWidth = 0         # hide Qtenv channel arrows; links drawn on the map
*.**.numGroundLinks = 40

# ---------------- routing ----------------
*.satellite[*].net.routingType = "Sat_Net_DijkstraRouting"
*.satellite[*].net.routing.metric = "delay"    # "delay" | "hop"
*.satellite[*].net.routing.dstStation = -1     # -1 = nearest station
*.terminal[*].net.routingType = "Ter_Net_DDRARouting"
**.maxHops = 64

# ---------------- visualization ----------------
# map (src/mapvis): satellites, stations, ISL/GSL, footprints, info box, SVG snapshots
*.mapVisualizer.refreshInterval = 1s
*.mapVisualizer.footprints = "gsl"
*.mapVisualizer.trails = ""
*.mapVisualizer.svgSnapshotTimes = ""          # e.g. "600 1200" (also works in Cmdenv)
*.mapVisualizer.svgSnapshotPrefix = "results/map"
# routes (FloraMapDataSource): one colour per packet route, fading out, with label
*.mapDataSource.maxRoutes = 8
*.mapDataSource.routeLifetime = 30s
*.mapDataSource.routeLogFile = "results/routes.csv"
*.mapDataSource.graphLogFile = ""
*.visualizer.canvasVisualizer.mediumVisualizer.typename = ""
*.visualizer.osgVisualizer.typename = ""      # INET built without OSG
*.visualizer.*.dataLinkVisualizer.displayLinks = false
*.visualizer.*.mobilityVisualizer.displayMovementTrails = false

# ---------------- ground segment ----------------
include stations/EsaDsn-Mobiles.ini
*.station[*].**.minimumElevation = 10
**.station[*].endToEndStatistics = true

# ---------------- terminals (DSL uplink, copied from Custom_default) ----------------
**.numTerminals = 30
include ../Custom_default/devices/WorldWide-30.ini
*.satellite[*].phyDSL.radio.antenna.mobilityModule = "^.^.^.mobility"
*.satellite[*].phyISL.radio.antenna.mobilityModule = "^.^.^.mobility"
*.satellite[*].phyGSL.radio.antenna.mobilityModule = "^.^.^.mobility"
*.satellite[*].phyDSL.radio.typename = "Sat_Dsl_Phy_CustomRadio"
*.satellite[*].phyDSL.radio.antenna.typename = "CustomAntenna"
*.satellite[*].phyDSL.radio.transmitter.typename = "CustomTransmitter"
*.satellite[*].phyDSL.radio.transmitter.preambleDuration = 2.5s
*.satellite[*].phyDSL.radio.transmitter.headerLength = 8B
*.satellite[*].phyDSL.radio.receiver.typename = "CustomReceiver"
*.satellite[*].phyDSL.radio.receiver.sensitivity = -120dBm
*.satellite[*].**.interfaceTableModule = ""
**.radioMedium.pathLoss.typename = "CustomPHYPathLoss"
**.radioMedium.pathLoss.polarizationLoss = 3dB
**.radioMedium.pathLoss.fadingSigma = 4dB
**.radioMedium.pathLoss.receiverSystemLoss = 4dB
**.radioMedium.pathLoss.decodingImplementation = 1.5dB
**.radioMedium.pathLoss.noiseFigureEnhancement = 3dB
**.radioMedium.typename = "CustomMedium"
**.radioMedium.analogModel.typename = "CustomPHYAnalogModel"
**.radioMedium.analogModel.rxAntennaGain_a = 0
**.radioMedium.analogModel.rxAntennaGain_b = 0
**.radioMedium.analogModel.rxAntennaGain_c = 1
**.radioMedium.analogModel.enableDoppler = false
**.radioMedium.backgroundNoise.power = 0dBm
**.radioMedium.analogModel.pathLossExponent = 2.0
**.radioMedium.analogModel.obstructionLossdB = 0dB
**.radioMedium.minimumElevationTermSat = 5.0
**.enableCollisions = true
**.enableCollisionOverlap = false
**.minCollisionOverlap = 0s
**.normalizedLoad_txBwHz = 100e3
**.normalizedLoad_maxDoppShiftHz = 10000.0
**.normalizedLoad_k = 295.0
**.normalizedLoad_n = 300.0
**.normalizedLoad_symb = 2.0
**.perFromLoad_a = 3
**.perFromLoad_b = 4.0
**.perFromLoad_c = 3.0
**.maxTUs = 100
**.cn0ThresholdForTU = 30.0
**.useLoadCn0PerCsv = false
*.terminal[*].phy.radio.typename = "Ter_Phy_CustomRadio"
*.terminal[*].phy.radio.antenna.mobilityModule = "^.^.^.mob"
*.terminal[*].dlk.mac.interfaceTableModule = ""
**.radio.energyConsumer.typename = "CustomEnergyConsumer"
**.radio.energyConsumer.energySourceModule = "^.IdealEpEnergyStorage"
**.maxTransmissionDuration = 1s
*.terminal[*].**.minimumElevationTermSat = 5.0
*.terminal[*].phy.radio.antenna.typename = "CustomAntenna"
*.terminal[*].phy.radio.transmitter.typename = "CustomTransmitter"
*.terminal[*].phy.radio.transmitter.preambleDuration = 2.5s
*.terminal[*].phy.radio.transmitter.headerLength = 8B
*.terminal[*].phy.radio.receiver.typename = "CustomReceiver"
*.terminal[*].phy.radio.receiver.sensitivity = -120dBm
**.radio.receiver.snirThreshold = -8dB
# routing statistics (must precede StatisticRecording.ini, which switches result recording off by default)
**.routing.pathHops.result-recording-modes = default
**.routing.pathDelay.result-recording-modes = default
**.traffic.e2eDelay.result-recording-modes = default
**.traffic.e2eHops.result-recording-modes = default
**.traffic.gsPacketSent.result-recording-modes = default
**.traffic.gsPacketReceived.result-recording-modes = default
include ../Custom_default/configurations/StatisticRecording.ini
# the following files define [Config ...] sections, so they must come last
include ../Custom_default/configurations/BlindTx.ini
include ../Custom_default/configurations/BandSelection.ini
include ../Custom_default/configurations/Services.ini

[Config Dijkstra132]
description = "Downlink (station -> ship/aircraft), delay-shortest path; mobile uplink off for now"
extends = BlindKineis, UHF, ServiceEveryMinute
**.numTerminals = 0
*.station[0..8].traffic.enabled = true
*.station[0..8].traffic.dstType = "mobile"     # downlink: stations -> ships / aircraft
*.station[9..12].traffic.enabled = false       # uplink (ships / aircraft -> stations): later
*.station[9..12].traffic.dstType = "station"   #   set enabled = true above to switch it on
*.station[*].traffic.sendInterval = 2s
*.station[*].traffic.packetSize = 1000B

[Config Dijkstra132Hop]
description = "Same traffic, hop-count shortest path (delay tie-break)"
extends = Dijkstra132
*.satellite[*].net.routing.metric = "delay"

[Config Dijkstra132Pair]
description = "Single downlink flow Goldstone (DSN) -> Flight ICN-LAX for easy visual tracking"
extends = Dijkstra132
*.station[0].traffic.dstStation = 11
*.station[0].traffic.sendInterval = 1s
*.station[1..8].traffic.enabled = false

[Config Dijkstra132StationsOnly]
description = "Station -> station traffic only (previous baseline)"
extends = Dijkstra132
*.station[0..8].traffic.dstType = "station"

[Config Dijkstra132Terminals]
description = "IoT terminals (DSL radio uplink) -> nearest station. NOTE: uplink link budget not tuned yet"
extends = BlindKineis, UHF, ServiceEveryMinute
