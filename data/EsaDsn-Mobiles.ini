# ---- mobile terminals on regular routes (uplink and downlink) ----
# waypoints "lat,lon ..." followed on great circles at constant speed, round trips;
# routeStart = start position as a fraction of the route (puts them mid-route at t = 0)
*.station[9..12].nodeType = "mobile"

# airliner Frankfurt (FRA) - New York (JFK), great circle, 900 km/h, FL360
*.station[9].label = "Flight FRA-JFK"
*.station[9].mobility.route = "50.0333,8.5706 40.6398,-73.7789"
*.station[9].mobility.speed = 250mps
*.station[9].mobility.altitudeKm = 11
*.station[9].mobility.routeStart = 0.45

# airliner Seoul Incheon (ICN) - Los Angeles (LAX), great circle over the North Pacific
*.station[10].label = "Flight ICN-LAX"
*.station[10].mobility.route = "37.4691,126.4505 33.9425,-118.4081"
*.station[10].mobility.speed = 250mps
*.station[10].mobility.altitudeKm = 11
*.station[10].mobility.routeStart = 0.5

