# Ground segment: NASA DSN complexes and ESA ESTRACK stations + mobile terminals (ships, aircraft)
# DSN coordinates: NASA Deep Space Network complexes (Wikipedia, decimal degrees)
# ESTRACK coordinates: derived from the ESA ESTRACK SPICE frame kernel (estrack_v04.tf, NAIF)
**.nrOfGS = 13

# ---- NASA Deep Space Network ----
*.station[0].label = "Goldstone (DSN)"
*.station[0].mobility.latitude = 35.42667
*.station[0].mobility.longitude = -116.89000
*.station[1].label = "Madrid (DSN)"
*.station[1].mobility.latitude = 40.43139
*.station[1].mobility.longitude = -4.24806
*.station[2].label = "Canberra (DSN)"
*.station[2].mobility.latitude = -35.40139
*.station[2].mobility.longitude = 148.98167

# ---- ESA ESTRACK ----
*.station[3].label = "Redu (ESA)"
